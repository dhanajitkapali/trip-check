<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="Trip Check — a packing checklist that resets itself every day."
    />
    <title>Trip Check</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trip Check" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header__top">
          <h1 class="header__title">Trip Check<span class="accent">.</span></h1>
          <button id="resetBtn" class="btn-reset" type="button">Reset</button>
        </div>
        <p id="dateLine" class="header__date"></p>

        <div class="progress">
          <div class="progress__bar"><span id="progressFill"></span></div>
          <p id="progressText" class="progress__text"></p>
        </div>
      </header>

      <main>
        <ul id="list" class="list" aria-label="Packing checklist"></ul>

        <p id="empty" class="empty" hidden>
          Nothing on your list yet — add your first item below.
        </p>
      </main>

      <form id="addForm" class="add" autocomplete="off">
        <input
          id="addInput"
          class="add__input"
          type="text"
          placeholder="Add an item…"
          maxlength="60"
          aria-label="Add an item"
        />
        <button class="add__btn" type="submit" aria-label="Add">+</button>
      </form>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
